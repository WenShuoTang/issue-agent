<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Issue Triage Agent architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d7b95"/>
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4FD1B5"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F0B37E"/>
    </marker>
    <style>
      .bg { fill:#0B1220; }
      .card { fill:#101B2B; stroke:#26374D; stroke-width:1.5; }
      .card-accent { fill:#131F30; stroke:#26374D; stroke-width:1.5; }
      .guard { fill:#0F1828; stroke:#3A4C63; stroke-width:1.5; }
      .title { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:21px; font-weight:700; fill:#4FD1B5; }
      .sub { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:15px; fill:#C9D7E6; }
      .small { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:12px; fill:#93A7BC; }
      .tiny { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:11px; fill:#7F93A8; }
      .chip { fill:#0F1B2A; stroke:#3C5B72; stroke-width:1.2; }
      .chiptext { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; fill:#DCE8F4; }
      .degrade { fill:#2A2130; stroke:#F0B37E; stroke-width:1.4; }
      .degradetext { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:15px; font-weight:700; fill:#F0B37E; }
      .line { stroke:#5D7B95; stroke-width:1.6; fill:none; }
      .linemint { stroke:#4FD1B5; stroke-width:1.6; fill:none; }
      .dashed { stroke:#6E8399; stroke-width:1.3; stroke-dasharray:5 5; fill:none; }
      .amber { stroke:#F0B37E; stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
      .legend { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:12px; fill:#8FA3B8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <!-- Guardrails -->
  <g>
    <rect class="guard" x="40" y="120" width="220" height="560" rx="16"/>
    <text class="title" x="150" y="164" text-anchor="middle">Guardrails</text>
    <line x1="70" y1="186" x2="230" y2="186" stroke="#2C3E52" stroke-width="1"/>
    <text class="sub" x="150" y="232" text-anchor="middle">Prompt-Injection</text>
    <text class="sub" x="150" y="252" text-anchor="middle">Defense</text>
    <line x1="70" y1="282" x2="230" y2="282" stroke="#2C3E52" stroke-width="1"/>
    <text class="sub" x="150" y="324" text-anchor="middle">Secret</text>
    <text class="sub" x="150" y="344" text-anchor="middle">Redaction</text>
    <line x1="70" y1="374" x2="230" y2="374" stroke="#2C3E52" stroke-width="1"/>
    <text class="sub" x="150" y="416" text-anchor="middle">Citation</text>
    <text class="sub" x="150" y="436" text-anchor="middle">Whitelist</text>
    <line x1="70" y1="466" x2="230" y2="466" stroke="#2C3E52" stroke-width="1"/>
    <text class="sub" x="150" y="508" text-anchor="middle">Read-only</text>
    <text class="sub" x="150" y="528" text-anchor="middle">Policy</text>
    <line x1="70" y1="558" x2="230" y2="558" stroke="#2C3E52" stroke-width="1"/>
    <text class="tiny" x="150" y="594" text-anchor="middle">untrusted content</text>
    <text class="tiny" x="150" y="612" text-anchor="middle">is data, not commands</text>
  </g>

  <!-- dashed links guardrails -> layers -->
  <path class="dashed" d="M260 300 H292" marker-end="url(#arrow)"/>
  <path class="dashed" d="M260 400 H292" marker-end="url(#arrow)"/>
  <path class="dashed" d="M260 500 H292" marker-end="url(#arrow)"/>

  <!-- 1 Web UI -->
  <g>
    <rect class="card" x="300" y="40" width="1080" height="72" rx="12"/>
    <text class="title" x="840" y="72" text-anchor="middle">Web UI</text>
    <text class="sub" x="840" y="96" text-anchor="middle">Provider · API Key (BYOK, not stored) · Repo / Issue · Streaming Trace · Cited Report</text>
  </g>
  <path class="line" d="M840 112 V128" marker-end="url(#arrow)"/>

  <!-- 2 API -->
  <g>
    <rect class="card" x="300" y="132" width="1080" height="72" rx="12"/>
    <text class="title" x="840" y="164" text-anchor="middle">API</text>
    <text class="sub" x="840" y="188" text-anchor="middle">FastAPI · API Key Auth · Tenant Isolation · Rate Limit · SSE Jobs</text>
  </g>
  <path class="line" d="M840 204 V220" marker-end="url(#arrow)"/>

  <!-- 3 Orchestration (no gradient; accent top line) -->
  <g>
    <rect class="card-accent" x="300" y="224" width="1080" height="150" rx="12"/>
    <rect x="300" y="224" width="1080" height="3" rx="1.5" fill="#4FD1B5"/>
    <text class="title" x="840" y="258" text-anchor="middle">Orchestration</text>
    <text class="sub" x="840" y="292" text-anchor="middle">Ingest → Plan → Act → Assess → Compose → Verify → Finalize</text>
    <text class="small" x="640" y="320" text-anchor="middle">Act ↔ Assess: need more evidence → back to act</text>
    <text class="small" x="1030" y="320" text-anchor="middle">Verify → Compose: unsupported claim → rewrite once</text>
    <text class="tiny" x="840" y="352" text-anchor="middle">bounded by budget · rounds · steps · wall clock</text>
  </g>

  <!-- degrade branch (inside canvas) -->
  <g>
    <rect class="degrade" x="1400" y="264" width="160" height="64" rx="10"/>
    <text class="degradetext" x="1480" y="292" text-anchor="middle">Degrade</text>
    <text class="tiny" x="1480" y="312" text-anchor="middle">budget / error</text>
  </g>
  <path class="amber" d="M1380 286 H1396" marker-end="url(#arrowAmber)"/>
  <path class="amber" d="M1380 330 H1430 V300 H1396" marker-end="url(#arrowAmber)"/>

  <path class="line" d="M840 374 V394" marker-end="url(#arrow)"/>

  <!-- 4 Capabilities -->
  <g>
    <rect class="card" x="300" y="398" width="1080" height="112" rx="12"/>
    <text class="title" x="840" y="428" text-anchor="middle">Capabilities</text>
    <g>
      <rect class="chip" x="322" y="444" width="244" height="50" rx="9"/>
      <text class="chiptext" x="444" y="465" text-anchor="middle">Tool Registry</text>
      <text class="tiny" x="444" y="484" text-anchor="middle">read-only · schema</text>
    </g>
    <g>
      <rect class="chip" x="582" y="444" width="244" height="50" rx="9"/>
      <text class="chiptext" x="704" y="465" text-anchor="middle">Hybrid RAG</text>
      <text class="tiny" x="704" y="484" text-anchor="middle">BM25 + Vector + RRF</text>
    </g>
    <g>
      <rect class="chip" x="842" y="444" width="244" height="50" rx="9"/>
      <text class="chiptext" x="964" y="465" text-anchor="middle">Memory</text>
      <text class="tiny" x="964" y="484" text-anchor="middle">checkpoint · episode</text>
    </g>
    <g>
      <rect class="chip" x="1102" y="444" width="244" height="50" rx="9"/>
      <text class="chiptext" x="1224" y="465" text-anchor="middle">Observability</text>
      <text class="tiny" x="1224" y="484" text-anchor="middle">spans · metrics</text>
    </g>
  </g>
  <path class="line" d="M840 510 V526" marker-end="url(#arrow)"/>

  <!-- 5 Models -->
  <g>
    <rect class="card" x="300" y="530" width="1080" height="100" rx="12"/>
    <text class="title" x="840" y="560" text-anchor="middle">Models</text>
    <g>
      <rect class="chip" x="452" y="576" width="120" height="30" rx="15"/>
      <text class="chiptext" x="512" y="596" text-anchor="middle">DeepSeek</text>
      <rect class="chip" x="586" y="576" width="106" height="30" rx="15"/>
      <text class="chiptext" x="639" y="596" text-anchor="middle">OpenAI</text>
      <rect class="chip" x="706" y="576" width="106" height="30" rx="15"/>
      <text class="chiptext" x="759" y="596" text-anchor="middle">Claude</text>
      <rect class="chip" x="826" y="576" width="92" height="30" rx="15"/>
      <text class="chiptext" x="872" y="596" text-anchor="middle">Qwen</text>
      <rect class="chip" x="932" y="576" width="96" height="30" rx="15"/>
      <text class="chiptext" x="980" y="596" text-anchor="middle">Ollama</text>
    </g>
    <text class="tiny" x="840" y="616" text-anchor="middle">12 provider presets · JSON / native tool protocol · BYOK</text>
  </g>
  <path class="line" d="M840 630 V642" marker-end="url(#arrow)"/>

  <!-- 6 Data -->
  <g>
    <rect class="card" x="300" y="646" width="1080" height="66" rx="12"/>
    <text class="title" x="840" y="676" text-anchor="middle">Data</text>
    <text class="sub" x="840" y="700" text-anchor="middle">GitHub REST API · SQLite (cache · memory · checkpoints)</text>
  </g>

  <!-- legend -->
  <g transform="translate(300,760)">
    <line class="line" x1="0" y1="0" x2="36" y2="0" marker-end="url(#arrow)"/>
    <text class="legend" x="46" y="4">main path</text>
    <line class="dashed" x1="150" y1="0" x2="186" y2="0" marker-end="url(#arrow)"/>
    <text class="legend" x="196" y="4">loop / rewrite</text>
    <line class="amber" x1="330" y1="0" x2="366" y2="0" marker-end="url(#arrowAmber)"/>
    <text class="legend" x="376" y="4">degrade</text>
    <text class="legend" x="520" y="4">Read-only by design · no code execution · no writes to GitHub</text>
  </g>
</svg>
