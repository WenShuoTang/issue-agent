name: "功能建议"
description: 提出新能力或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 用户场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - Agent 编排
        - 检索 / RAG
        - 工具 / GitHub
        - 记忆 / 缓存
        - 安全 / 护栏
        - API / 前端
        - 评测 / 可观测
        - 文档
